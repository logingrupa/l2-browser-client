<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local character asset inspection</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #24292b; color: #faf6ed; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-rows: auto minmax(300px, 1fr) auto; height: 100dvh; }
      header, footer { padding: 12px 18px; background: #202527; }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      label { display: flex; gap: 6px; align-items: center; }
      select, button { min-height: 36px; padding: 6px 10px; border: 1px solid #768080; border-radius: 3px; background: #363f40; color: inherit; font: inherit; }
      button:disabled { opacity: .5; }
      canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      .viewport { position: relative; min-height: 0; }
      .labels { position: absolute; inset: 0; pointer-events: none; }
      .label { position: absolute; transform: translate(-50%, -100%); font-size: 13px; white-space: nowrap; text-shadow: 0 1px 4px #000; }
      footer { font-size: 12px; color: #c4cecd; }
      #status { margin: 6px 0 0; }
      @media (max-width: 600px) { header, footer { padding: 8px; } h1 { font-size: 15px; } .controls { gap: 5px; } select { max-width: 160px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Converted characters · native rig inspection</h1>
        <div class="controls">
          <label>View <select id="variant" aria-label="Character view"><option value="all">All four</option><option>MFighter</option><option>FFighter</option><option>MMagic</option><option>FMagic</option></select></label>
          <label>Clip <select id="clip" aria-label="Native clip"><option>wait_Hand</option><option>run_Hand</option><option>Atk01_Hand</option></select></label>
          <button id="play" type="button" disabled>Pause playback</button>
          <label>Frame <input id="frame" type="number" value="0" min="0" step="0.25" style="width:70px" aria-label="Animation frame" /></label>
          <button id="show-frame" type="button" disabled>Show frame</button>
          <button id="sample" type="button" disabled>Inspect skinning</button>
          <button id="independent" type="button" disabled>Check independent instances</button>
          <button id="grounding" type="button" disabled>Measure grounding repair</button>
        </div>
        <p id="status" role="status">Loading four local GLBs…</p>
      </header>
      <div class="viewport"><canvas id="inspection-canvas" aria-label="Native character models"></canvas><div class="labels" id="labels"></div></div>
      <footer>Babylon.js 9.27.1 · exported scale and origins preserved · seven separate parts per character · unarmed starter appearance</footer>
    </main>
    <script type="module" src="./assetInspection.ts"></script>
  </body>
</html>
